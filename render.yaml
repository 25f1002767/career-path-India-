services:
  - type: web
    name: mpath-career-counselling
    env: python
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "gunicorn app:app"
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.11.9