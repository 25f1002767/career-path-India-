{% extends "base.html" %}

{% block title %}
CareerPath India
{% endblock %}

{% block content %}

<style>

/* =========================================================
   CAREERPATH INDIA
   SMOOTH CINEMATIC TRICOLOUR ENERGY
   ========================================================= */

.cpi-home {
    position: relative;
    width: 100%;
    min-height: 100vh;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 50%,
            #16283f 0%,
            #091522 38%,
            #030a12 72%,
            #000000 100%
        );

    color: white;
}


/* =========================================================
   CANVAS
   ========================================================= */

#cpiEnergyCanvas {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 5;

    pointer-events: none;
}


/* =========================================================
   BACKGROUND GLOWS
   ========================================================= */

.cpi-bg-orange {
    position: fixed;

    width: 700px;
    height: 700px;

    left: -350px;
    top: -350px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,153,51,.28),
            rgba(255,153,51,.07) 45%,
            transparent 72%
        );

    filter: blur(55px);

    animation:
        orangeFloat
        10s
        ease-in-out
        infinite alternate;

    pointer-events: none;
}


.cpi-bg-green {
    position: fixed;

    width: 700px;
    height: 700px;

    right: -350px;
    bottom: -350px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(19,136,8,.25),
            rgba(19,136,8,.06) 45%,
            transparent 72%
        );

    filter: blur(55px);

    animation:
        greenFloat
        11s
        ease-in-out
        infinite alternate;

    pointer-events: none;
}


.cpi-center-glow {
    position: fixed;

    width: 1000px;
    height: 650px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,.07),
            transparent 70%
        );

    filter: blur(35px);

    pointer-events: none;
}


@keyframes orangeFloat {

    from {
        transform:
            translate(0, 0)
            scale(.85);
    }

    to {
        transform:
            translate(150px, 110px)
            scale(1.15);
    }

}


@keyframes greenFloat {

    from {
        transform:
            translate(0, 0)
            scale(.85);
    }

    to {
        transform:
            translate(-150px, -110px)
            scale(1.15);
    }

}


/* =========================================================
   CONTENT
   ========================================================= */

.cpi-content {
    position: relative;

    z-index: 50;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;
}


/* =========================================================
   TITLE
   ========================================================= */

.cpi-title {
    margin: 0;

    padding: 0 20px;

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    font-size:
        clamp(
            48px,
            8vw,
            105px
        );

    font-weight: 900;

    line-height: 1;

    letter-spacing: -4px;

    background:
        linear-gradient(
            90deg,
            #ff9933 0%,
            #ff9933 28%,
            #ffffff 45%,
            #ffffff 55%,
            #4caf50 74%,
            #138808 100%
        );

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;

    opacity: 0;

    transform:
        translateY(20px)
        scale(.96);

    filter: blur(5px);

    animation:
        titleReveal
        1s
        .2s
        cubic-bezier(.16,1,.3,1)
        forwards;
}


@keyframes titleReveal {

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);

        filter: blur(0);
    }

}


/* =========================================================
   TRICOLOUR LINE
   ========================================================= */

.cpi-line {
    width:
        min(430px, 70vw);

    height: 5px;

    margin-top: 28px;

    border-radius: 50px;

    background:
        linear-gradient(
            90deg,
            #ff9933 0%,
            #ff9933 33%,
            #ffffff 33%,
            #ffffff 66%,
            #138808 66%,
            #138808 100%
        );

    box-shadow:
        0 0 18px rgba(255,153,51,.45),
        0 0 18px rgba(255,255,255,.18),
        0 0 18px rgba(19,136,8,.45);

    opacity: 0;

    animation:
        lineReveal
        .8s
        1s
        ease
        forwards;
}


@keyframes lineReveal {

    to {
        opacity: 1;
    }

}


/* =========================================================
   LOGIN BUTTON
   ========================================================= */

.cpi-login {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-width: 185px;

    margin-top: 34px;

    padding:
        14px 42px;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #ff9933,
            #e87918
        );

    border:
        1px solid
        rgba(255,255,255,.35);

    color: #ffffff !important;

    text-decoration: none !important;

    font-size: 17px;

    font-weight: 700;

    box-shadow:
        0 12px 38px
        rgba(255,153,51,.30);

    opacity: 0;

    transform:
        translateY(15px);

    animation:
        loginReveal
        .8s
        1.2s
        cubic-bezier(.16,1,.3,1)
        forwards;

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}


@keyframes loginReveal {

    to {
        opacity: 1;

        transform:
            translateY(0);
    }

}


.cpi-login:hover {
    color: #ffffff !important;

    transform:
        translateY(-4px)
        scale(1.04);

    box-shadow:
        0 20px 50px
        rgba(255,153,51,.48);
}


/* =========================================================
   HINT
   ========================================================= */

.cpi-hint {
    position: fixed;

    bottom: 28px;
    left: 50%;

    transform:
        translateX(-50%);

    z-index: 60;

    color:
        rgba(255,255,255,.45);

    font-size: 11px;

    letter-spacing: 2px;

    text-transform: uppercase;

    pointer-events: none;

    opacity: 0;

    animation:
        hintReveal
        1s
        2s
        ease
        forwards;
}


@keyframes hintReveal {

    to {
        opacity: .8;
    }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .cpi-title {
        font-size:
            clamp(
                40px,
                11vw,
                70px
            );

        letter-spacing: -2px;
    }

    .cpi-line {
        height: 4px;
    }

    .cpi-hint {
        font-size: 8px;
        letter-spacing: 1px;
    }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;
    }

}

</style>


<!-- =========================================================
     HOME PAGE
========================================================= -->

<div class="cpi-home">


    <!-- Background effects -->

    <div class="cpi-bg-orange"></div>

    <div class="cpi-bg-green"></div>

    <div class="cpi-center-glow"></div>


    <!-- Energy canvas -->

    <canvas id="cpiEnergyCanvas"></canvas>


    <!-- Main content -->

    <div class="cpi-content">

        <h1 class="cpi-title">
            CareerPath India
        </h1>


        <div class="cpi-line"></div>


        <a
            href="{{ url_for('auth.login') }}"
            class="cpi-login">

            Login

        </a>

    </div>


    <div class="cpi-hint">
        Move your cursor • Click anywhere
    </div>


</div>


<script>

/* =========================================================
   SMOOTH TRICOLOUR ENERGY ENGINE
   ========================================================= */

(function () {

    "use strict";


    const canvas =
        document.getElementById(
            "cpiEnergyCanvas"
        );


    if (!canvas) {
        return;
    }


    const ctx =
        canvas.getContext("2d");


    let width = 0;
    let height = 0;
    let dpr = 1;


    /* =====================================================
       SMOOTH MOUSE
       ===================================================== */

    const mouse = {

        targetX:
            window.innerWidth / 2,

        targetY:
            window.innerHeight / 2,

        x:
            window.innerWidth / 2,

        y:
            window.innerHeight / 2,

        previousX:
            window.innerWidth / 2,

        previousY:
            window.innerHeight / 2,

        velocityX: 0,

        velocityY: 0,

        speed: 0

    };


    /* =====================================================
       TRAIL HISTORY
       ===================================================== */

    const trailHistory = [];

    const MAX_HISTORY = 85;


    /* =====================================================
       CLICK BURSTS
       ===================================================== */

    const bursts = [];


    /* =====================================================
       PARTICLES
       ===================================================== */

    const particles = [];


    /* =====================================================
       TRICOLOUR
       ===================================================== */

    const colours = {

        saffron: "#FF9933",

        white: "#FFFFFF",

        green: "#138808"

    };


    /* =====================================================
       RESIZE
       ===================================================== */

    function resize() {

        dpr =
            Math.min(
                window.devicePixelRatio || 1,
                2
            );


        width =
            window.innerWidth;


        height =
            window.innerHeight;


        canvas.width =
            width * dpr;


        canvas.height =
            height * dpr;


        canvas.style.width =
            width + "px";


        canvas.style.height =
            height + "px";


        ctx.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );

    }


    window.addEventListener(
        "resize",
        resize
    );


    /* =====================================================
       TARGET MOUSE
       ===================================================== */

    window.addEventListener(

        "mousemove",

        function (event) {

            mouse.targetX =
                event.clientX;

            mouse.targetY =
                event.clientY;

        }

    );


    /* =====================================================
       CLICK
       ===================================================== */

    window.addEventListener(

        "click",

        function (event) {

            createBurst(
                event.clientX,
                event.clientY
            );


            for (
                let i = 0;
                i < 65;
                i++
            ) {

                createParticle(
                    event.clientX,
                    event.clientY
                );

            }

        }

    );


    /* =====================================================
       SMOOTH MOUSE UPDATE
       ===================================================== */

    function updateMouse() {

        mouse.previousX =
            mouse.x;

        mouse.previousY =
            mouse.y;


        /*
         * This is the important part.
         *
         * Instead of jumping directly
         * to the mouse position, the
         * energy smoothly catches up.
         */

        mouse.x +=
            (
                mouse.targetX -
                mouse.x
            )
            *
            .12;


        mouse.y +=
            (
                mouse.targetY -
                mouse.y
            )
            *
            .12;


        mouse.velocityX =
            mouse.x -
            mouse.previousX;


        mouse.velocityY =
            mouse.y -
            mouse.previousY;


        mouse.speed =
            Math.sqrt(

                mouse.velocityX *
                mouse.velocityX

                +

                mouse.velocityY *
                mouse.velocityY

            );

    }


    /* =====================================================
       STORE SMOOTH PATH
       ===================================================== */

    function updateHistory() {

        trailHistory.push({

            x: mouse.x,

            y: mouse.y

        });


        if (
            trailHistory.length >
            MAX_HISTORY
        ) {

            trailHistory.shift();

        }

    }


    /* =====================================================
       CREATE PARTICLE
       ===================================================== */

    function createParticle(
        x,
        y
    ) {

        const angle =
            Math.random()
            *
            Math.PI
            *
            2;


        const speed =
            1 +
            Math.random() * 5;


        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle)
                * speed,

            vy:
                Math.sin(angle)
                * speed,

            size:
                2 +
                Math.random() * 3,

            life:
                45 +
                Math.random() * 40,

            colour:
                [
                    colours.saffron,
                    colours.white,
                    colours.green
                ][
                    Math.floor(
                        Math.random() * 3
                    )
                ]

        });

    }


    /* =====================================================
       CREATE BURST
       ===================================================== */

    function createBurst(
        x,
        y
    ) {

        bursts.push({

            x: x,

            y: y,

            radius: 10,

            life: 0,

            maxLife: 65

        });

    }


    /* =====================================================
       DRAW SMOOTH CURVE
       ===================================================== */

    function drawSmoothPath(
        points,
        offset
    ) {

        if (
            points.length < 4
        ) {

            return;

        }


        ctx.beginPath();


        const first =
            points[0];


        ctx.moveTo(

            first.x,

            first.y + offset

        );


        for (
            let i = 1;
            i < points.length - 2;
            i++
        ) {

            const current =
                points[i];


            const next =
                points[i + 1];


            const controlX =
                current.x;


            const controlY =
                current.y +
                offset;


            const endX =
                (
                    current.x +
                    next.x
                ) / 2;


            const endY =
                (
                    current.y +
                    next.y
                ) / 2
                +
                offset;


            ctx.quadraticCurveTo(

                controlX,

                controlY,

                endX,

                endY

            );

        }


        const last =
            points[
                points.length - 1
            ];


        ctx.lineTo(

            last.x,

            last.y + offset

        );

    }


    /* =====================================================
       DRAW ONE ENERGY RIBBON
       ===================================================== */

    function drawRibbon(
        colour,
        offset,
        widthValue
    ) {

        if (
            trailHistory.length < 5
        ) {

            return;

        }


        /*
         * We want a long trail.
         *
         * Older points fade toward
         * the beginning.
         */

        const points =
            trailHistory;


        /* =================================================
           OUTER GLOW
        ================================================= */

        drawSmoothPath(
            points,
            offset
        );


        ctx.save();


        ctx.strokeStyle =
            colour;


        ctx.lineCap =
            "round";


        ctx.lineJoin =
            "round";


        ctx.globalAlpha =
            .08;


        ctx.lineWidth =
            widthValue * 4;


        ctx.shadowBlur =
            45;


        ctx.shadowColor =
            colour;


        ctx.stroke();


        /* =================================================
           MEDIUM GLOW
        ================================================= */

        drawSmoothPath(
            points,
            offset
        );


        ctx.globalAlpha =
            .16;


        ctx.lineWidth =
            widthValue * 2;


        ctx.shadowBlur =
            25;


        ctx.stroke();


        /* =================================================
           MAIN ENERGY
        ================================================= */

        drawSmoothPath(
            points,
            offset
        );


        ctx.globalAlpha =
            .65;


        ctx.lineWidth =
            widthValue;


        ctx.shadowBlur =
            12;


        ctx.stroke();


        /* =================================================
           BRIGHT CORE
        ================================================= */

        drawSmoothPath(
            points,
            offset
        );


        ctx.globalAlpha =
            .82;


        ctx.lineWidth =
            2.5;


        ctx.shadowBlur =
            7;


        ctx.stroke();


        ctx.restore();

    }


    /* =====================================================
       DRAW TRICOLOUR ENERGY
       ===================================================== */

    function drawEnergy() {

        /*
         * The three lines are thin.
         *
         * Their length comes from
         * the 85-point history.
         */

        drawRibbon(
            colours.saffron,
            -18,
            11
        );


        drawRibbon(
            colours.white,
            0,
            11
        );


        drawRibbon(
            colours.green,
            18,
            11
        );

    }


    /* =====================================================
       UPDATE PARTICLES
       ===================================================== */

    function updateParticles() {

        for (
            let i =
                particles.length - 1;

            i >= 0;

            i--
        ) {

            const p =
                particles[i];


            p.x += p.vx;

            p.y += p.vy;


            p.vx *= .96;

            p.vy *= .96;


            p.life--;


            if (
                p.life <= 0
            ) {

                particles.splice(
                    i,
                    1
                );

            }

        }


        if (
            particles.length > 350
        ) {

            particles.splice(
                0,
                particles.length - 350
            );

        }

    }


    /* =====================================================
       DRAW PARTICLES
       ===================================================== */

    function drawParticles() {

        particles.forEach(

            function (p) {

                ctx.save();


                ctx.globalAlpha =
                    Math.max(
                        0,
                        p.life / 80
                    );


                ctx.fillStyle =
                    p.colour;


                ctx.shadowBlur =
                    10;


                ctx.shadowColor =
                    p.colour;


                ctx.beginPath();


                ctx.arc(
                    p.x,
                    p.y,
                    p.size,
                    0,
                    Math.PI * 2
                );


                ctx.fill();


                ctx.restore();

            }

        );

    }


    /* =====================================================
       UPDATE BURSTS
       ===================================================== */

    function updateBursts() {

        for (
            let i =
                bursts.length - 1;

            i >= 0;

            i--
        ) {

            const burst =
                bursts[i];


            burst.life++;


            if (
                burst.life >=
                burst.maxLife
            ) {

                bursts.splice(
                    i,
                    1
                );

            }

        }

    }


    /* =====================================================
       DRAW CLICK BURST
       ===================================================== */

    function drawBursts() {

        bursts.forEach(

            function (burst) {

                const progress =
                    burst.life /
                    burst.maxLife;


                const alpha =
                    1 -
                    progress;


                const radius =
                    15 +
                    progress *
                    260;


                ctx.save();


                ctx.globalAlpha =
                    alpha;


                /*
                 * Saffron ring.
                 */

                ctx.beginPath();


                ctx.arc(
                    burst.x,
                    burst.y,
                    radius,
                    0,
                    Math.PI * 2
                );


                ctx.strokeStyle =
                    colours.saffron;


                ctx.lineWidth =
                    9;


                ctx.shadowBlur =
                    35;


                ctx.shadowColor =
                    colours.saffron;


                ctx.stroke();


                /*
                 * White ring.
                 */

                ctx.beginPath();


                ctx.arc(
                    burst.x,
                    burst.y,
                    radius * .70,
                    0,
                    Math.PI * 2
                );


                ctx.strokeStyle =
                    colours.white;


                ctx.lineWidth =
                    7;


                ctx.shadowBlur =
                    28;


                ctx.shadowColor =
                    colours.white;


                ctx.stroke();


                /*
                 * Green ring.
                 */

                ctx.beginPath();


                ctx.arc(
                    burst.x,
                    burst.y,
                    radius * .42,
                    0,
                    Math.PI * 2
                );


                ctx.strokeStyle =
                    colours.green;


                ctx.lineWidth =
                    7;


                ctx.shadowBlur =
                    25;


                ctx.shadowColor =
                    colours.green;


                ctx.stroke();


                ctx.restore();

            }

        );

    }


    /* =====================================================
       MAIN ANIMATION
       ===================================================== */

    function animate() {

        /*
         * Smooth mouse movement.
         */

        updateMouse();


        /*
         * Save cursor path.
         */

        updateHistory();


        /*
         * Dark transparent overlay.
         */

        ctx.fillStyle =
            "rgba(3,8,14,.12)";


        ctx.fillRect(
            0,
            0,
            width,
            height
        );


        /*
         * Draw long smooth
         * tricolour energy.
         */

        drawEnergy();


        /*
         * Particles.
         */

        updateParticles();

        drawParticles();


        /*
         * Click effects.
         */

        updateBursts();

        drawBursts();


        requestAnimationFrame(
            animate
        );

    }


    /* =====================================================
       START
       ===================================================== */

    resize();


    /*
     * Start with a clean
     * history around center.
     */

    for (
        let i = 0;
        i < MAX_HISTORY;
        i++
    ) {

        trailHistory.push({

            x: mouse.x,

            y: mouse.y

        });

    }


    requestAnimationFrame(
        animate
    );


})();

</script>

{% endblock %}
