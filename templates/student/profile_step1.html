{% extends "base.html" %}

{% block title %}
Complete Profile
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow border-0 rounded-4">

                <div class="card-body p-5">

                    <h2 class="mb-4">
                        Step 1 of 4
                    </h2>

                    <h4 class="mb-4">
                        Basic Information
                    </h4>

                    <form>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label>Phone Number</label>

                                <input
                                    type="text"
                                    class="form-control">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>State</label>

                                <input
                                    type="text"
                                    class="form-control">

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label>District</label>

                                <input
                                    type="text"
                                    class="form-control">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Current Class</label>

                                <input
                                    type="text"
                                    class="form-control">

                            </div>

                        </div>

                        <div class="mb-4">

                            <label>School / College</label>

                            <input
                                type="text"
                                class="form-control">

                        </div>

                        <button
                            class="btn btn-primary">

                            Save & Continue

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
